name: API Streamlit y Docker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_TOKEN: prueba-ci-academica-sin-datos-reales
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest pruebas -q --junitxml=evidencias/pytest-ci.xml
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Probar HTTP entre componentes
        run: |
          TEST_ENV=docker_ci python scripts/smoke.py
          TEST_ENV=docker_ci python scripts/regression_http.py
          python scripts/analyze_segments.py
          docker compose exec -T web python -c "from frontend.client import call; assert call('/v1/predict',{'texto':'Operating profit fell sharply.'})['priorizar_revision']"
          curl --fail http://127.0.0.1:8501/_stcore/health
          docker image inspect vertice-fase2:1.0.0 > evidencias/docker-image-ci.json
          docker compose ps --format json > evidencias/docker-services-ci.json
      - if: always()
        run: docker compose logs --no-color > evidencias/docker-ci.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-fase2
          path: evidencias/
      - if: always()
        run: docker compose down
